spring.application.name=pedagofeedback
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pedagofeedback_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.cache=false

# Adresse du site, utilisée dans le QR code
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Mot de passe du compte admin créé au premier lancement
app.admin-password=${APP_ADMIN_PASSWORD:admin1234}
