<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' - PedagoFeedback'">PedagoFeedback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<!-- Logo : icône + nom -->
<span th:fragment="marque" class="brand-inner">
    <svg class="brand-mark" viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
        <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7c3aed"/>
                <stop offset="1" stop-color="#ec4899"/>
            </linearGradient>
        </defs>
        <rect width="40" height="40" rx="11" fill="url(#logoGrad)"/>
        <path d="M10 11h20a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H21l-6 5v-5h-5a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3z" fill="#ffffff"/>
        <rect x="14" y="21" width="3.4" height="3.5" rx="1" fill="#7c3aed"/>
        <rect x="18.3" y="17.5" width="3.4" height="7" rx="1" fill="#a855f7"/>
        <rect x="22.6" y="14" width="3.4" height="10.5" rx="1" fill="#ec4899"/>
    </svg>
    <span class="brand-text"><b>Pedago</b><em>Feedback</em></span>
</span>

<!-- Menu pour les enseignants connectés -->
<header th:fragment="navbar(actif)" class="navbar">
    <div class="navbar-inner">
        <a class="brand" th:href="@{/seances}">
            <span th:replace="~{fragments :: marque}"></span>
        </a>
        <nav>
            <a th:href="@{/seances}" th:classappend="${actif == 'seances'} ? 'actif'">Séances</a>
            <a th:href="@{/calendrier}" th:classappend="${actif == 'calendrier'} ? 'actif'">Calendrier</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/enseignants}"
               th:classappend="${actif == 'enseignants'} ? 'actif'">Enseignants</a>
            <a th:href="@{/dashboard}" th:classappend="${actif == 'dashboard'} ? 'actif'">Tableau de bord</a>
            <span class="user-box">
                <span class="user-name" sec:authentication="name">utilisateur</span>
                <form class="inline" th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-sm btn-secondary">Déconnexion</button>
                </form>
            </span>
        </nav>
    </div>
</header>

<!-- Menu simplifié pour les pages publiques (connexion, étudiants) : logo sans lien -->
<header th:fragment="navbarPublic" class="navbar">
    <div class="navbar-inner">
        <span class="brand">
            <span th:replace="~{fragments :: marque}"></span>
        </span>
    </div>
</header>

<div th:fragment="messages">
    <div class="alert alert-success" th:if="${succes}" th:text="${succes}"></div>
    <div class="alert alert-error" th:if="${erreur}" th:text="${erreur}"></div>
</div>

</body>
</html>
