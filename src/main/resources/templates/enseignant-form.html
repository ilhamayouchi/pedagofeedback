<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${titre})}"></head>
<body>
<header th:replace="~{fragments :: navbar('enseignants')}"></header>

<main class="container container-narrow">
    <div class="page-header">
        <div>
            <h1 th:text="${titre}">Enseignant</h1>
        </div>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <div class="card">
        <form th:action="@{${action}}" th:object="${enseignantForm}" method="post" novalidate>

            <div class="grid-2">
                <div class="field">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" th:field="*{nom}">
                    <div class="error" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>
                <div class="field">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" th:field="*{prenom}">
                    <div class="error" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>
                </div>
            </div>

            <div class="field">
                <label for="specialite">Spécialité (discipline enseignée)</label>
                <input type="text" id="specialite" th:field="*{specialite}">
                <div class="error" th:if="${#fields.hasErrors('specialite')}" th:errors="*{specialite}"></div>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}">
                <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" th:field="*{username}" autocomplete="off">
                    <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div class="field">
                    <label for="motDePasse">
                        Mot de passe <span class="muted small" th:unless="${nouveau}">(vide = inchangé)</span>
                    </label>
                    <input type="password" id="motDePasse" th:field="*{motDePasse}" autocomplete="new-password">
                    <div class="error" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></div>
                </div>
            </div>

            <div class="form-actions">
                <a class="btn btn-secondary" th:href="@{/enseignants}">Annuler</a>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
